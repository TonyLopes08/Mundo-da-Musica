<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra | Mundo da Música</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="topo">
      <div class="logo">
        <span>Mundo da Música</span>
      </div>
      <nav class="menu">
        <a href="index.html#instrumentos">Instrumentos</a>
        <a href="index.html#cifras">Cifras</a>
        <a href="index.html#produtos">Cursos</a>
      </nav>
      <a class="botao destaque" href="pagamento.html">Começar agora</a>
    </header>

    <main class="conteudo">
      <section class="formulario">
        <h1 class="titulo-principal">Finalizar Compra</h1>
        <p class="subtitulo">Escolha uma forma de pagamento abaixo:</p>

        <form>
          <label for="pagamento">Forma de pagamento</label>
          <select id="pagamento" name="formas de pagamento" required>
            <option value="">Selecione a forma de pagamento</option>
            <option value="credito">Cartão de Crédito</option>
            <option value="pix">Pix</option>
            <option value="debito">Cartão de Débito</option>
          </select>
          <button type="submit">Enviar</button>
        </form>
      </section>

      <div class="voltar">
        <a href="index.html">
          <button>Voltar a Página Principal</button>
        </a>
      </div>
    </main>
  </body>
</html>
